<g fill="#B8CADE" font-size="14"><text x="63" y="161">Selected files</text><text x="63" y="180">+ requested action</text><text x="299" y="161">Structured operations</text><text x="299" y="180">without direct writes</text><text x="535" y="161">Paths / collisions</text><text x="535" y="180">permissions / policy</text><text x="771" y="161">Diff + confirmation</text><text x="771" y="180">for every change</text><text x="1007" y="161">Filesystem adapter</text><text x="1007" y="180">+ result report</text></g>
